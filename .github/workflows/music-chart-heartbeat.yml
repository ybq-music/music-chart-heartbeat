name: Music Chart Daily

on:
  workflow_dispatch:
  schedule:
    # UTC time. These are Beijing time:
    # 00:53, 06:37, 08:19, 10:43, 12:07,
    # 14:38, 16:49, 18:13, 20:57, 22:21.
    # These avoid the common :00, :15, :30, :45 windows; duplicate official dates are skipped.
    - cron: "53 16 * * *"
    - cron: "37 22 * * *"
    - cron: "19 0 * * *"
    - cron: "43 2 * * *"
    - cron: "7 4 * * *"
    - cron: "38 6 * * *"
    - cron: "49 8 * * *"
    - cron: "13 10 * * *"
    - cron: "57 12 * * *"
    - cron: "21 14 * * *"

permissions:
  contents: write

concurrency:
  group: music-chart-daily
  cancel-in-progress: false

env:
  TARGET_DAYS: "7"
  COLLECTION_START_ON: "2026-07-09"

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect daily music charts
        id: collect
        continue-on-error: true
        run: python scripts/collect_music_charts.py

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data ]; then git add data; fi
          if [ -d outputs ]; then git add outputs; fi
          if [ -f RUN_STATUS.md ]; then git add RUN_STATUS.md; fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily music chart snapshot"
            git pull --rebase
            git push
          fi

      - name: Mark workflow failed when collection failed
        if: steps.collect.outcome != 'success'
        run: exit 1
