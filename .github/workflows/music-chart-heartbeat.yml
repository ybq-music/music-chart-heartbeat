name: Music Chart Daily

on:
  workflow_dispatch:
  schedule:
    # UTC time. These are Beijing time 10:17, 14:17, 18:17, 22:17.
    # Multiple attempts reduce the chance of missing a daily snapshot.
    - cron: "17 2,6,10,14 * * *"

permissions:
  contents: write

concurrency:
  group: music-chart-daily
  cancel-in-progress: false

env:
  TARGET_DAYS: "7"

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect daily music charts
        id: collect
        continue-on-error: true
        run: python scripts/collect_music_charts.py

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data ]; then git add data; fi
          if [ -d outputs ]; then git add outputs; fi
          if [ -f RUN_STATUS.md ]; then git add RUN_STATUS.md; fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily music chart snapshot"
            git pull --rebase
            git push
          fi

      - name: Mark workflow failed when collection failed
        if: steps.collect.outcome != 'success'
        run: exit 1
